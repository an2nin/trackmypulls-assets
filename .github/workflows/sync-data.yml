name: Sync data to main repo

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: trackmypulls
            repository: an2nin/trackmypulls
            ref: master
            data_path: app/lib/config
    steps:
      - name: Checkout assets repo
        uses: actions/checkout@v4

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.repository }}
          path: main-repo
          token: ${{ secrets.MAIN_REPO_TOKEN }}
          ref: ${{ matrix.target.ref }}

      - name: Copy assets
        run: |
          mkdir -p ./main-repo/${{ matrix.target.data_path }}/games
          rsync -av --delete ./static/data/converted/ ./main-repo/${{ matrix.target.data_path }}/

      - name: Commit and push
        run: |
          cd main-repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "${{ matrix.target.data_path }}/images"
          git commit -m "sync image data from data repo" || echo "No changes to commit"
          git push origin HEAD:${{ matrix.target.ref }}
